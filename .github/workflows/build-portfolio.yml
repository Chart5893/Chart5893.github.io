name: Build and publish portfolio

on:
  push:
    branches: [main]
    paths:
      - 'company-offices-app/client/src/**'
      - 'company-offices-app/client/public/**'
      - 'company-offices-app/client/package*.json'
      - 'build-portfolio.cjs'
      - '.github/workflows/build-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: company-offices-app/client/package-lock.json
      - name: Install dependencies
        working-directory: company-offices-app/client
        run: npm ci
      - name: Build site
        run: node build-portfolio.cjs
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html static company-results.html asset-manifest.json favicon.svg robots.txt manifest.json 2>/dev/null || true
          git add -A -- '*.html' 'static/**' 'asset-manifest.json' 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Build portfolio for GitHub Pages"
            git push
          fi
